<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
  <main class="gift">
    <h1>Go-шечка <span>(pro)</span></h1>

      <div class="ticket-stub" aria-label="Скидка 10 процентов">−10%</div>
      <div class="ticket-code">
        <input id="promo" value="GOSHECHKA10" readonly spellcheck="false" aria-label="Промокод GOSHECHKA10">

      </div>
    </div>
    <div class="actions">
      <button id="copy" type="button" hidden>Скопировать код <span aria-hidden="true">⧉</span></button>
      <p id="copy-status" role="status" aria-live="polite"></p>
    </div>
    <a class="course-link" href="https://stepik.org/course/300562/promo" target="_blank" rel="noopener noreferrer">Посмотреть курс <span aria-hidden="true">↗</span></a>
