<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><link rel="icon" href="data:,"><title>Учебный пример</title><link rel="stylesheet" href="../types.css"><script type="module" src="../types.js"></script></head><body class="widget-document"><section class="type-lab" data-decimal aria-label="Точность и диапазон цены"><div class="lab-control"><label>Цена<input value="1490.50" maxlength="25" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Цена"></label><label class="precision-control">Тип<select aria-label="Тип цены"><option value="10,2">DECIMAL(10, 2)</option><option value="5,2">DECIMAL(5, 2)</option><option value="6,3">DECIMAL(6, 3)</option></select></label></div><div class="sample-values"><button type="button" data-sample="999.99">999.99</button><button type="button" data-sample="12.345">12.345</button><button type="button" data-sample="999.995">999.995</button></div><div class="digits-surface"><div class="digits-legend"><span data-whole-count>8 цифр до точки</span><span data-scale-count>2 после точки</span></div><div class="digit-slots" data-slots aria-hidden="true"></div><div class="decimal-result"><span>Результат хранения</span><strong data-result>1490.50</strong></div></div><p class="lab-status" data-status role="status" aria-live="polite"></p><p class="mode-note">Строгий режим MySQL</p></section></body></html>
