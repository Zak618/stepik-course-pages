<!doctype html>
<html lang="ru">
<head><base href="../../../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Промокод · Go-шечка (pro)</title>
  <link rel="stylesheet" href="assets/go-mini-pro-gift.css?v=compact-2">
  <script src="assets/go-mini-pro-gift.js?v=compact-2" defer></script>
</head>
<body>
  <main class="gift">
    <div class="ticket">
      <div class="ticket-stub" aria-label="Скидка 10 процентов">−10%</div>
      <div class="ticket-code">
        <input id="promo" value="GOSHECHKA10" readonly spellcheck="false" aria-label="Промокод GOSHECHKA10">
        <canvas id="cover" hidden tabindex="0" role="button" aria-label="Сотрите покрытие мышью или пальцем. Нажмите Enter, чтобы открыть код с клавиатуры."></canvas>
        <div class="actions">
          <button id="copy" type="button" hidden>Скопировать код <span aria-hidden="true">⧉</span></button>
          <p id="copy-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
