<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Знакомство с курсом — локальный просмотр</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#23324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 28px 15px;background:#fff;border-bottom:1px solid #e7ecf5}header .top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.025em}.local{font-size:11px;color:#8a98ac}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0}button{border:0;background:#f1f4fa;color:#77869c;padding:11px 14px;border-radius:12px;white-space:nowrap;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}button[aria-pressed=true]{background:#eaf0ff;color:#3567d0}button:focus-visible,a:focus-visible{outline:3px solid #92b4f4;outline-offset:3px}.tools{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 28px;color:#91a0b5;font-size:12px}.tools a{color:#5276ac;text-decoration:none}iframe{display:block;width:calc(100% - 36px);height:calc(100svh - 168px);min-height:600px;margin:0 auto 18px;background:white;border:1px solid #e8edf5;border-radius:18px;transition:max-width .25s}body.phone iframe{max-width:390px}.tools button{padding:7px 12px;font-size:12px;background:#eaf0fa;color:#55749b}@media(max-width:550px){header{padding:18px 16px 12px}.top .local{display:none}.tools{padding:12px 16px}iframe{width:calc(100% - 16px);height:calc(100svh - 162px);border-radius:12px}h1{font-size:15px}}
  </style>
</head>
<body>
  <header><div class="top"><h1>Go-шечка (mini) · Знакомство с курсом</h1><span class="local">Локальные страницы · без публикации</span></div>
    <nav class="tabs" aria-label="Шаги урока">
      <button type="button" data-step="01" aria-pressed="false">Приветствие</button>
      <button type="button" data-step="02" aria-pressed="false">Telegram</button>
      <button type="button" data-step="03" aria-pressed="true">Как вы узнали?</button>
      <button type="button" data-step="04" aria-pressed="false">Правила</button>
      <button type="button" data-step="05" aria-pressed="false">Карта курсов</button>
      <button type="button" data-step="06" aria-pressed="false">Начинаем</button>
    </nav>
  </header>
  <div class="tools"><span>Можно пройти все шаги или открыть каждый отдельно.</span><span><button id="phone-toggle" type="button" aria-pressed="false">Телефон</button> <a id="open-page" href="go-mini-module-01-lesson-01-step-03.html" target="_blank" rel="noopener">Открыть отдельно ↗</a></span></div>
  <iframe id="preview" src="go-mini-module-01-lesson-01-step-03.html" title="Предпросмотр шага: Как вы узнали?"></iframe>
  <script>
    const frame=document.querySelector('#preview');
    const tabs=[...document.querySelectorAll('[data-step]')];
    const heights={'01':620,'02':720,'03':700,'04':700,'05':860,'06':600};
    function openStep(id){const button=tabs.find(b=>b.dataset.step===id);if(!button)return;tabs.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const url='go-mini-module-01-lesson-01-step-'+id+'.html';frame.src=url;frame.style.height=heights[id]+'px';frame.title='Предпросмотр шага: '+button.textContent;document.querySelector('#open-page').href=url;history.replaceState(null,'','#'+id);}
    tabs.forEach(b=>b.addEventListener('click',()=>openStep(b.dataset.step)));
    openStep(/^#0[1-6]$/.test(location.hash)?location.hash.slice(1):'03');
    document.querySelector('#phone-toggle').addEventListener('click',event=>{const on=document.body.classList.toggle('phone');event.currentTarget.setAttribute('aria-pressed',String(on));event.currentTarget.textContent=on?'Полная ширина':'Телефон';});
  </script>
</body>
</html>
