<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Подписывайтесь на Telegram-канал @webosnovy.">
  <title>Telegram-канал — Go-шечка (mini), модуль 01, урок 01, шаг 02</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171b27;
      --muted: #667085;
      --blue: #2481f2;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: var(--paper);
    }

    .orbits {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .orbit-track {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--track-width);
      aspect-ratio: 1;
      border: 1px solid #edf2f8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit-track--outer {
      --track-width: min(94vw, 820px);
      --plane-color: #2481f2;
    }

    .orbit-track--middle {
      --track-width: min(86vw, 760px);
      --plane-color: #7566e9;
      border-style: solid;
      border-color: #eef2f8;
    }

    .orbit-track--inner {
      --track-width: min(78vw, 700px);
      --plane-color: #20a1d8;
      border-color: #f2f5f9;
    }

    .plane-badge {
      position: absolute;
      top: var(--plane-top, 50%);
      left: var(--plane-left, 50%);
      width: var(--plane-size, 34px);
      height: var(--plane-size, 34px);
      color: var(--plane-color);
      transform: translate(-50%, -50%);
    }

    .plane-badge svg { display: block; width: 100%; height: 100%; }

    .orbit-track--outer .plane-badge { --plane-left: 83%; --plane-top: 84%; }
    .orbit-track--middle .plane-badge { --plane-left: 7%; --plane-top: 75%; }
    .orbit-track--inner .plane-badge { --plane-left: 47%; --plane-top: 1%; }

    @media (max-width: 600px) {
      .orbit-track--outer { --track-width: min(98vw, 390px); }
      .orbit-track--middle { --track-width: min(94vw, 375px); }
      .orbit-track--inner { --track-width: min(90vw, 360px); }
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 580px);
      padding: 36px 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 7.5vw, 76px);
      font-weight: 760;
      letter-spacing: -.075em;
      line-height: 1.02;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(105deg, #168de0 5%, #3679ef 48%, #7165e9 96%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .copy {
      max-width: 535px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      font-weight: 430;
      letter-spacing: -.025em;
      line-height: 1.65;
    }

    .channel-link {
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(105deg, #2789ee, #5869eb);
      box-shadow: 0 12px 28px rgba(51, 112, 225, .22);
      font-size: 17px;
      font-weight: 650;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .channel-link:hover {
      box-shadow: 0 16px 34px rgba(51, 112, 225, .3);
      transform: translateY(-2px);
    }

    .channel-link:focus-visible {
      outline: 3px solid rgba(55, 121, 239, .35);
      outline-offset: 4px;
    }

    .channel-link svg { width: 20px; height: 20px; }

    @media (max-width: 600px) {
      .plane-badge { --plane-size: 30px; }
      .content { width: min(60vw, 280px); padding: 14px 0; }
      h1 { font-size: clamp(24px, 7vw, 28px); }
      .copy { margin-top: 12px; font-size: 14px; line-height: 1.45; }
      .channel-link { min-height: 44px; gap: 8px; margin-top: 16px; padding-inline: 16px; font-size: 14px; }
      .channel-link svg { width: 17px; height: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="orbits" aria-hidden="true">
      <div class="orbit-track orbit-track--outer" data-orbit data-duration="36" data-phase="0.12" data-direction="1">
        <div class="plane-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
          </svg>
        </div>
      </div>
      <div class="orbit-track orbit-track--middle" data-orbit data-duration="31" data-phase="0.42" data-direction="-1">
        <div class="plane-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
          </svg>
        </div>
      </div>
      <div class="orbit-track orbit-track--inner" data-orbit data-duration="26" data-phase="0.74" data-direction="1">
        <div class="plane-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
          </svg>
        </div>
      </div>
    </div>

    <section class="content" aria-labelledby="title">
      <h1 id="title">Подписывайтесь <span>на @webosnovy</span></h1>
      <p class="copy">В Telegram-канале много всего интересного.</p>
      <a class="channel-link" href="https://t.me/webosnovy" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
        </svg>
        <span>Открыть канал</span>
      </a>
    </section>
  </main>
  <script>
    (() => {
      const flights = [...document.querySelectorAll('[data-orbit]')].map(track => ({
        track,
        plane: track.querySelector('.plane-badge'),
        duration: Number(track.dataset.duration) * 1000,
        phase: Number(track.dataset.phase),
        direction: Number(track.dataset.direction),
      }));

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const movePlanes = time => {
        flights.forEach(({ track, plane, duration, phase, direction }) => {
          const angle = 2 * Math.PI * (phase + direction * time / duration);
          plane.style.left = `${50 + Math.cos(angle) * 50}%`;
          plane.style.top = `${50 + Math.sin(angle) * 50}%`;
        });
      };

      movePlanes(0);
      if (!prefersReducedMotion) {
        const animate = time => {
          movePlanes(time);
          requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }
    })();
  </script>
</body>
</html>
