<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Подписывайтесь на Telegram-канал @webosnovy.">
  <title>Telegram-канал — Go-шечка (mini), модуль 01, урок 01, шаг 02</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171b27;
      --muted: #667085;
      --blue: #2481f2;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: var(--paper);
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(70vw, 660px);
      aspect-ratio: 1;
      border: 1px solid #edf2f8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit::before,
    .orbit::after {
      position: absolute;
      inset: 9%;
      border: 1px dashed #eef2f8;
      border-radius: inherit;
      content: "";
    }

    .orbit::after {
      inset: 18%;
      border-style: solid;
      border-color: #f4f6fa;
    }

    .orbit-rotator {
      position: absolute;
      inset: 0;
      animation: orbit 24s linear infinite;
      will-change: transform;
    }

    .plane-badge {
      position: absolute;
      top: 0;
      left: 50%;
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      border: 1px solid #edf2f8;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(37, 79, 142, .1);
      color: var(--blue);
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .plane-badge svg { width: 31px; height: 31px; }

    @keyframes orbit {
      to { transform: rotate(1turn); }
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 660px);
      padding: 36px 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 7.5vw, 76px);
      font-weight: 760;
      letter-spacing: -.075em;
      line-height: 1.02;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(105deg, #168de0 5%, #3679ef 48%, #7165e9 96%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .copy {
      max-width: 535px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      font-weight: 430;
      letter-spacing: -.025em;
      line-height: 1.65;
    }

    .channel-link {
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(105deg, #2789ee, #5869eb);
      box-shadow: 0 12px 28px rgba(51, 112, 225, .22);
      font-size: 17px;
      font-weight: 650;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .channel-link:hover {
      box-shadow: 0 16px 34px rgba(51, 112, 225, .3);
      transform: translateY(-2px);
    }

    .channel-link:focus-visible {
      outline: 3px solid rgba(55, 121, 239, .35);
      outline-offset: 4px;
    }

    .channel-link svg { width: 20px; height: 20px; }

    @media (max-width: 600px) {
      .orbit { width: min(88vw, 430px); }
      .orbit::before { inset: 8%; }
      .orbit::after { inset: 18%; }
      .plane-badge { width: 52px; height: 52px; border-radius: 19px; }
      .plane-badge svg { width: 27px; height: 27px; }
      .content { width: min(100% - 24px, 520px); padding-inline: 10px; }
      h1 { font-size: clamp(42px, 11vw, 62px); }
      .copy { margin-top: 20px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="orbit" aria-hidden="true">
      <div class="orbit-rotator">
        <div class="plane-badge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
          </svg>
        </div>
      </div>
    </div>

    <section class="content" aria-labelledby="title">
      <h1 id="title">Подписывайтесь <span>на @webosnovy</span></h1>
      <p class="copy">В Telegram-канале много всего интересного.</p>
      <a class="channel-link" href="https://t.me/webosnovy" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21.3 3.2 18 20.1c-.2 1.2-.9 1.5-1.9.9l-5.2-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.3L5 13.1l-5.1-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 1.7.2 1.6 1.2Z" fill="currentColor" transform="translate(2 0) scale(.9)"/>
        </svg>
        <span>Открыть канал</span>
      </a>
    </section>
  </main>
</body>
</html>
